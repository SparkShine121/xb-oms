<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>产品设计部 · 协作工作台</title>
<style>
:root{
  --bg:#0E0E10; --panel:#17171B; --panel2:#1E1E24; --panel3:#26262E;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
  --txt:#F2F3F5; --mut:#8A8F98; --dim:#5C616B;
  --lime:#CBF74E; --blue:#3355FF; --orange:#FF7A3D; --green:#4ADE80;
  --r-frame:32px; --r-card:24px; --r-in:16px;
  --ease:cubic-bezier(.22,1,.36,1);
  --font:'Inter','Manrope','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--font);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
.hide{display:none!important}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--txt);background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:10px 14px;outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--lime)}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
a{color:var(--lime)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#2c2c34;border-radius:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-card);padding:20px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;background:var(--panel3);color:var(--mut);white-space:nowrap}
.chip.p0{background:rgba(255,122,61,.14);color:var(--orange)}
.chip.p1{background:rgba(51,85,255,.16);color:#8FA5FF}
.chip.p2{background:rgba(255,255,255,.07);color:var(--mut)}
.chip.lime{background:rgba(203,247,78,.13);color:var(--lime)}
.chip.green{background:rgba(74,222,128,.13);color:var(--green)}
.chip.grey{background:rgba(255,255,255,.06);color:var(--dim)}
.avt{width:28px;height:28px;border-radius:50%;object-fit:cover;background:var(--panel3);flex:none;border:1px solid var(--line2)}
.avt.big{width:56px;height:56px}
.avt.sm{width:22px;height:22px}
.dot-online{position:absolute;right:-1px;bottom:-1px;width:9px;height:9px;border-radius:50%;background:var(--green);border:2px solid var(--panel)}
.dot-off{background:var(--dim)}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--lime);transition:width .7s var(--ease)}
.bar i.warn{background:var(--orange)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:12px;font-size:13.5px;font-weight:600;transition:transform .18s var(--ease),opacity .18s}
.btn:active{transform:scale(.96)}
.btn.pri{background:var(--lime);color:#101204}
.btn.sec{background:var(--panel3);color:var(--txt);border:1px solid var(--line2)}
.btn.ghost{color:var(--mut);padding:8px 10px}
.btn.danger{background:rgba(255,122,61,.12);color:var(--orange)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:10px}
.mut{color:var(--mut)} .dim{color:var(--dim)} .or{color:var(--orange)} .gr{color:var(--green)} .li{color:var(--lime)}
/* ---------- 登录页 ---------- */
.login{display:flex;min-height:100vh}
.login-brand{flex:1.1;display:flex;flex-direction:column;justify-content:center;padding:8vh 6vw;background:radial-gradient(1000px 700px at 12% 10%,rgba(51,85,255,.28),transparent 55%),radial-gradient(900px 700px at 85% 90%,rgba(203,247,78,.12),transparent 55%),#0B0B0D;position:relative;overflow:hidden}
.login-brand::after{content:'';position:absolute;width:420px;height:420px;border:1px solid var(--line);border-radius:50%;right:-160px;top:-120px}
.login-brand::before{content:'';position:absolute;width:280px;height:280px;border:1px dashed rgba(255,255,255,.08);border-radius:50%;left:8%;bottom:-90px}
.lb-tag{display:inline-flex;align-items:center;gap:8px;color:var(--lime);font-size:13px;font-weight:600;letter-spacing:.12em}
.lb-tag::before{content:'';width:22px;height:2px;background:var(--lime)}
.lb-title{font-size:clamp(34px,4.2vw,54px);font-weight:800;letter-spacing:-.02em;line-height:1.22;margin:22px 0 14px}
.lb-sub{color:var(--mut);max-width:420px}
.lb-stats{display:flex;gap:36px;margin-top:52px}
.lb-stats .v{font-size:34px;font-weight:800;letter-spacing:-.02em}
.lb-stats .v em{font-style:normal;font-size:15px;color:var(--lime);margin-left:2px}
.lb-stats .k{color:var(--dim);font-size:12.5px;margin-top:2px}
.login-side{flex:.9;display:flex;align-items:center;justify-content:center;padding:40px 24px}
.login-card{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:var(--r-frame);padding:32px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.lc-tabs{display:flex;background:var(--panel2);border-radius:12px;padding:4px;margin-bottom:22px}
.lc-tabs button{flex:1;padding:8px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--mut)}
.lc-tabs button.on{background:var(--panel3);color:var(--txt);box-shadow:0 2px 10px rgba(0,0,0,.35)}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:6px}
.field input{width:100%}
.lc-btn{width:100%;justify-content:center;padding:12px;margin-top:6px}
.demo-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.demo-chips button{display:inline-flex;align-items:center;gap:6px;padding:5px 11px 5px 5px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:12px;color:var(--mut);transition:border .2s,color .2s}
.demo-chips button:hover{border-color:var(--lime);color:var(--txt)}
.login-note{margin-top:14px;font-size:11.8px;color:var(--dim);line-height:1.7}
/* ---------- 应用壳 ---------- */
.shell{display:flex;height:100vh;padding:14px;gap:14px}
.side{width:76px;flex:none;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-frame);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:6px}
.side .logo{width:38px;height:38px;border-radius:12px;background:var(--lime);color:#101204;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}

.icobtn{position:relative;width:36px;height:36px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--mut);transition:.2s}

.pg-h{display:flex;align-items:center;gap:12px;margin-bottom:20px}

.grid{display:grid;gap:16px}

.card h3{font-size:14.5px;margin-bottom:14px;display:flex;align-items:center;gap:8px}

/* 总览 */
.tm-card{position:relative;overflow:hidden}

.task-row.od .due{color:var(--orange);font-weight:600}
.task-row.fd .t b{color:var(--dim);text-decoration:line-through}
.ckbx{width:19px;height:19px;flex:none;border-radius:6px;border:1.5px solid var(--line2);background:transparent;display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;transition:.2s var(--ease)}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .wd{color:var(--dim);font-size:10.5px;padding:4px 0}
.cal .cd{position:relative;aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--mut);cursor:pointer;transition:.15s var(--ease);border:1px solid transparent}
.cal .cd:hover{background:var(--panel2)}

.cal .cd.today{background:var(--lime);color:#101204;font-weight:800}
.cal .cd.sel{border-color:var(--line2);background:var(--panel2)}

.cal .cd.today .pts i{background:#101204}
.cal .cd .ms{position:absolute;inset:2px;border:1.5px solid #fff;border-radius:9px;pointer-events:none}
.cal-lg .cd{aspect-ratio:1.15;font-size:13px;border-radius:var(--r-in)}
.ev-row{display:flex;gap:12px;padding:10px 12px;border-radius:var(--r-in);background:var(--panel2);border:1px solid var(--line);margin-bottom:8px;align-items:center}
.ev-row .cl{width:3px;align-self:stretch;border-radius:2px}
.ev-row .tm{font-size:12px;color:var(--mut);width:40px}
.ev-row b{font-size:13px}
.ev-row .mt{font-size:11.5px;color:var(--dim)}
.c-lime{background:var(--lime)} .c-blue{background:var(--blue)} .c-orange{background:var(--orange)} .c-grey{background:var(--dim)}

.pj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.pj{cursor:pointer;transition:transform .25s var(--ease),border-color .25s;position:relative}
.pj:hover{transform:translateY(-3px);border-color:var(--line2)}
.pj.hl-card{border-color:rgba(203,247,78,.35);background:linear-gradient(160deg,rgba(203,247,78,.06),transparent 40%),var(--panel)}
.pj .code{font-size:10px;font-weight:800;letter-spacing:.1em;color:#101204;background:var(--lime);border-radius:7px;padding:2.5px 8px}
.pj .code.b{background:var(--blue);color:#fff} .pj .code.o{background:var(--orange);color:#fff} .pj .code.g{background:#5C616B;color:#fff} .pj .code.st{background:var(--panel3);color:var(--mut)}
.pj h4{font-size:16px;margin:12px 0 3px}
.pj .ddl{font-size:12px;color:var(--mut)}
.pj .row{display:flex;align-items:center;gap:12px;margin-top:14px}
.pj .stats{display:flex;gap:16px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line2);font-size:11.5px;color:var(--dim)}
.pj .stats b{color:var(--txt);font-size:14px;display:block}
.avatars{display:flex}
.avatars img{width:24px;height:24px;border-radius:50%;border:2px solid var(--panel);margin-left:-7px}
.avatars img:first-child{margin-left:0}
.avatars .x{width:24px;height:24px;border-radius:50%;background:var(--panel3);border:2px solid var(--panel);margin-left:-7px;font-size:9.5px;display:flex;align-items:center;justify-content:center;color:var(--mut)}
/* 详情 & 看板 & 甘特 */
.tabs{display:flex;gap:4px;background:var(--panel2);padding:4px;border-radius:14px;border:1px solid var(--line)}
.tabs button{padding:7px 16px;border-radius:11px;font-size:12.8px;color:var(--mut);font-weight:600}
.tabs button.on{background:var(--panel3);color:var(--txt)}
.kb{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:840px}
.kb-wrap{overflow-x:auto;padding-bottom:6px}
.lane{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-card);padding:12px;min-height:240px}
.lane h5{font-size:12.5px;display:flex;gap:8px;align-items:center;margin-bottom:10px;color:var(--mut)}
.lane h5 .n{background:var(--panel3);border-radius:999px;padding:1px 8px;font-size:11px}
.lane.over{border-color:var(--lime);background:rgba(203,247,78,.05)}
.kcard{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r-in);padding:12px;margin-bottom:10px;cursor:grab;transition:transform .2s var(--ease),box-shadow .2s}
.kcard:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.kcard:active{cursor:grabbing}
.kcard.drag{opacity:.4}
.kcard.hl-k{border-color:rgba(203,247,78,.4)}
.kcard .tt{font-size:13px;font-weight:600;margin:6px 0 4px}
.kcard .meta{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--dim);margin-top:8px;flex-wrap:wrap}
.kcard.od-k{border-color:rgba(255,122,61,.45)}
.gantt{min-width:760px}
.g-row{display:grid;grid-template-columns:170px 1fr;align-items:center;gap:10px;padding:7px 0}
.g-lab{font-size:12px;display:flex;align-items:center;gap:7px;min-width:0}
.g-lab b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.g-track{position:relative;height:26px;background:repeating-linear-gradient(90deg,transparent,transparent calc(100%/14 - 1px),var(--line) calc(100%/14 - 1px),var(--line) calc(100%/14))}
.g-bar{position:absolute;top:4px;height:18px;border-radius:9px;background:rgba(51,85,255,.55);border:1px solid var(--blue)}
.g-bar.p0{background:rgba(203,247,78,.3);border-color:var(--lime)}
.g-bar.odp0{background:rgba(255,122,61,.28);border-color:var(--orange)}
.g-head{display:grid;grid-template-columns:170px 1fr;gap:10px}
.g-days{display:grid;grid-template-columns:repeat(14,1fr);font-size:9.5px;color:var(--dim);text-align:center}
.file-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-in);border:1px solid var(--line);background:var(--panel2);margin-bottom:8px;cursor:pointer;transition:.2s}
.file-row:hover{border-color:var(--line2)}
.fic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;flex:none}
.fic.fig{background:rgba(203,247,78,.13);color:var(--lime)} .fic.png{background:rgba(51,85,255,.16);color:#8FA5FF}
.fic.pdf{background:rgba(255,122,61,.14);color:var(--orange)} .fic.xls{background:rgba(74,222,128,.13);color:var(--green)} .fic.zip{background:rgba(255,255,255,.07);color:var(--mut)}
.doc-card{border:1px solid var(--line);background:var(--panel2);border-radius:var(--r-card);padding:16px;cursor:pointer;transition:.22s var(--ease)}
.doc-card:hover{border-color:var(--line2);transform:translateY(-2px)}
.doc-card .ic{font-size:22px}
/* 成员 */
.mb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.mb{display:flex;flex-direction:column;gap:10px}
.mb .top{display:flex;gap:12px;align-items:center}
.mb .pos{position:relative;flex:none}
.mb h4{font-size:14.5px}
.mb .rl{font-size:11.5px;color:var(--dim)}
/* 数据/后台图表 */
.wk{display:flex;gap:14px;align-items:flex-end;height:150px;padding-top:10px}
.wk .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.wk .col i{width:100%;max-width:38px;border-radius:8px 8px 4px 4px;background:var(--panel3);transition:height .8s var(--ease)}
.wk .col.last i{background:var(--lime)}
.wk .col span{font-size:10px;color:var(--dim)}
.wk .col b{font-size:11px;color:var(--mut)}
.heat-row{display:grid;grid-template-columns:120px 1fr 36px;gap:10px;align-items:center;font-size:12px;padding:5px 0}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r-card)}
table.tb{width:100%;border-collapse:collapse;font-size:12px;min-width:760px}
.tb th{text-align:left;color:var(--dim);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line2);position:sticky;top:0;background:var(--panel);white-space:nowrap}
.tb td{padding:9px 12px;border-bottom:1px solid var(--line);color:var(--mut);white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis}
.tb tr:hover td{background:var(--panel2);color:var(--txt)}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .v{font-size:24px;font-weight:800}
.kpi .k{font-size:11.5px;color:var(--dim)}
.rec{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:12.3px}
.rec:last-child{border:none}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:13px 2px;border-bottom:1px solid var(--line)}
.set-row:last-child{border:none}
.sw{width:38px;height:21px;border-radius:999px;background:var(--panel3);position:relative;cursor:pointer;transition:.25s var(--ease);flex:none}
.sw::after{content:'';position:absolute;top:2.5px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--dim);transition:.25s var(--ease)}
.sw.on{background:var(--lime)} .sw.on::after{left:19px;background:#101204}
/* 弹窗/抽屉/toast/引导/命令面板 */
.mask{position:fixed;inset:0;background:rgba(5,6,8,.72);backdrop-filter:blur(4px);z-index:80;display:flex;align-items:center;justify-content:center;animation:fade .25s var(--ease)}
.modal{width:min(720px,92vw);max-height:84vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r-frame);padding:28px;animation:pop .32s var(--ease)}
@keyframes fade{from{opacity:0}} @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(390px,94vw);background:var(--panel);border-left:1px solid var(--line2);z-index:85;display:flex;flex-direction:column;animation:slide .32s var(--ease);box-shadow:-30px 0 70px rgba(0,0,0,.5)}
@keyframes slide{from{transform:translateX(100%)}}
.msg-me{align-self:flex-end;background:var(--lime);color:#101204;border-radius:16px 16px 4px 16px;max-width:80%;padding:9px 13px;font-size:13px;margin:3px 0}
.msg-them{align-self:flex-start;background:var(--panel3);border-radius:16px 16px 16px 4px;max-width:80%;padding:9px 13px;font-size:13px;margin:3px 0}
.conv{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:12px;cursor:pointer}
.conv:hover,.conv.on{background:var(--panel2)}
#toasts{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#000;border:1px solid var(--line2);color:var(--txt);padding:10px 18px;border-radius:999px;font-size:13px;animation:pop .3s var(--ease);box-shadow:0 10px 40px rgba(0,0,0,.6);max-width:80vw}
.toast.warn{border-color:rgba(255,122,61,.5)}
#pal-root{position:fixed;inset:0;background:rgba(5,6,8,.6);z-index:95;display:flex;justify-content:center;padding-top:14vh}
.pal{width:min(560px,92vw);height:max-content;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r-card);overflow:hidden;box-shadow:0 40px 90px rgba(0,0,0,.6);animation:pop .25s var(--ease)}
.pal input{width:100%;border:none;border-radius:0;background:transparent;padding:16px 18px;font-size:15px}
.pal .it{display:flex;gap:10px;align-items:center;padding:9px 16px;font-size:13px;cursor:pointer;color:var(--mut)}
.pal .it.on,.pal .it:hover{background:var(--panel2);color:var(--txt)}
.pal .grp{font-size:10.5px;color:var(--dim);padding:8px 16px 2px;letter-spacing:.08em}
.tour-mask{position:fixed;inset:0;z-index:100;background:rgba(5,6,8,.78);pointer-events:auto}
.tour-card{position:fixed;z-index:101;width:300px;background:var(--panel);border:1px solid var(--lime);border-radius:var(--r-card);padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:pop .3s var(--ease)}
.tour-hl{position:fixed;z-index:100;border:2px solid var(--lime);border-radius:16px;box-shadow:0 0 0 4000px rgba(5,6,8,.78);transition:.35s var(--ease);pointer-events:none}
.skl{background:linear-gradient(90deg,var(--panel2) 25%,var(--panel3) 50%,var(--panel2) 75%);background-size:200% 100%;animation:sh 1.4s infinite;border-radius:var(--r-card)}
@keyframes sh{to{background-position:-200% 0}}
.fade-in{animation:fin .35s var(--ease)} @keyframes fin{from{opacity:0;transform:translateY(6px)}}
.hint{font-size:11.5px;color:var(--dim);background:var(--panel2);border:1px dashed var(--line2);border-radius:12px;padding:8px 12px}
</style>
</head>

/* ================= 网络层（响应统一 {ok,data}） ================= */
async function api(path,body){
  const opt=body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)};
  const r=await fetch(path,opt);
  const j=await r.json().catch(()=>({ok:false,error:'bad json'}));
  if(!j.ok) throw Object.assign(new Error(j.error||('HTTP '+r.status)),{status:r.status});
  return j.data;
}

/* ================= SVG 手绘 sparkline ================= */
function spark(vals,w=92,h=34,stroke='var(--lime)',fill=true){
  const min=Math.min(...vals),max=Math.max(...vals),rg=(max-min)||1;
  const pts=vals.map((v,i)=>[i/(vals.length-1)*w,h-2-(v-min)/rg*(h-8)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=fill?`<path d="${d} L${w} ${h} L0 ${h} Z" fill="url(#sg)" opacity=".18"/>`:'';
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${stroke}"/><stop offset="1" stop-color="transparent"/></linearGradient></defs>${area}<path d="${d}" fill="none" stroke="${stroke}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="2.4" fill="${stroke}"/></svg>`;
}
function spark2(a,b,w=92,h=34){return spark(a,w,h,'var(--blue)')
  .replace('</svg>',spark(b,w,h,'rgba(255,255,255,.28)',false).replace(/^<svg[^>]*>/,'').replace(/<\/svg>$/,'')+'</svg>');}

/* ================= 启动 & bootstrap ================= */
async function enterApp(me,didLogin){
  S.me=me;$('#login').classList.add('hide');$('#shell').classList.remove('hide');
  renderTopbar();renderNav();
  skeleton();
  try{const d=await api('/api/bootstrap');Object.assign(S,d);S.cards=d.kanbanCards||[];S.loading=false;}
  catch(e){Object.assign(S,JSON.parse(JSON.stringify(MOCK)));S.cards=S.kanbanCards;S.me=me;S.loading=false;toast('已离线，展示本地演示数据');}
  // 保证 members 用于头像解析（离线场景下 AVA 依赖 S.members）
  if(!S.members||!S.members.length)S.members=MOCK.members;
  renderTopbar();
  if(didLogin)track('登录','账号 '+me.account);
  go(S.me.role==='admin'?'overview':'overview');
  track('page_view','进入 '+S.view);
}
function skeleton(){
  $('#view').innerHTML=`<div class="grid g3">${'<div class="skl" style="height:120px"></div>'.repeat(3)}<div class="skl" style="height:300px"></div><div class="skl" style="height:300px"></div></div>`;
}
async function boot(){
  renderChips();
  try{const d=await api('/auth/me');S.me=d.user;enterApp(S.me,false);}
  catch(e){showLogin();}
}

function calGrid(dayAttr,big){
  const first=new Date(YEAR,MONTH-1,1);
  let off=(first.getDay()+6)%7; // 周一开头
  const dim=new Date(YEAR,MONTH,0).getDate();
  let html=`<div class="cal ${big?'cal-lg':''}">${['一','二','三','四','五','六','日'].map(d=>`<div class="wd">${d}</div>`).join('')}`;
  for(let i=0;i<off;i++)html+=`<div class="cd out"></div>`;
  for(let d=1;d<=dim;d++){
    const evs=S.events.filter(e=>e.day===d);
    const pts=evs.slice(0,3).map(()=>'<i></i>').join('');
    html+=`<div class="cd ${d===TODAY?'today':''} ${S.sideDay===d?'sel':''}" ${dayAttr} data-day="${d}"><span class="num">${d}</span>${pts?`<span class="pts">${pts}</span>`:''}${S.milestones.includes(d)?'<span class="ms"></span>':''}</div>`;
  }
  return html+'</div>';
}
function eventsOfDay(d){return S.events.filter(e=>e.day===d).sort((a,b)=>a.time<b.time?-1:1);}
function evRow(e,adminDel){
  return `<div class="ev-row"><i class="cl c-${e.color}"></i><span class="tm num">${esc(e.time)}</span><div style="flex:1"><b>${esc(e.title)}</b><div class="mt">${esc(e.meta||'')}</div></div>${adminDel&&isAdmin()?`<button class="btn ghost sm" data-act="del-event" data-id="${e.id}" title="删除">✕</button>`:''}</div>`;

   <div class="field"><label>说明</label><input id="ev-meta" placeholder="参与人 · 地点"></div>
   <div class="field"><label>颜色标记</label><select id="ev-color"><option value="blue">蓝 · 会议</option><option value="lime">绿 · 协作</option><option value="orange">橙 · 风险/截止</option><option value="grey">灰 · 例行</option></select></div>
   <div style="text-align:right;display:flex;gap:8px;justify-content:flex-end"><button class="btn sec" data-act="close">取消</button><button class="btn pri" data-act="save-event">保存日程</button></div>`);
}
function newProjectModal(){
  modal(`<h2 style="font-size:17px;margin-bottom:14px">新建项目</h2>
   <div class="field"><label>项目名称</label><input id="pj-name" placeholder="如 官网 2.0 概念验证"></div>
   <div class="grid g22" style="grid-template-columns:1fr 1fr"><div class="field"><label>代号徽章</label><input id="pj-code" placeholder="POC" maxlength="6"></div><div class="field"><label>截止日期</label><input id="pj-ddl" placeholder="9月30日"></div></div>
   <div class="field"><label>初始任务数</label><input id="pj-total" type="number" value="12"></div>
   <div style="text-align:right;display:flex;gap:8px;justify-content:flex-end"><button class="btn sec" data-act="close">取消</button><button class="btn pri" data-act="save-project">创建项目</button></div>`);
}
function newTaskModal(){
  modal(`<h2 style="font-size:17px;margin-bottom:14px">新建任务</h2>
   <div class="field"><label>标题</label><input id="tk-title" placeholder="要做什么"></div>
   <div class="grid g22" style="grid-template-columns:1fr 1fr"><div class="field"><label>优先级</label><select id="tk-prio"><option>P1</option><option>P0</option><option>P2</option></select></div><div class="field"><label>截止</label><input id="tk-due" placeholder="8月31日"></div></div>
   <div class="field"><label>分组（dir）</label><input id="tk-dir" value="${isAdmin()?'设计方向':'我的清单'}"></div>
   <div style="text-align:right;display:flex;gap:8px;justify-content:flex-end"><button class="btn sec" data-act="close">取消</button><button class="btn pri" data-act="save-task">创建任务</button></div>`);
}
function notifModal(){
  const list=(S.metrics&&S.metrics.notifications)||[{icon:'⚠',text:'「视觉规范 v2 评审」已逾期，今天 17:00 预审会',time:'10 分钟前'},{icon:'💬',text:'苏晚给你发来 2 条新留言',time:'38 分钟前'},{icon:'✅',text:'徐柏舟完成了「暗色模式样式变量」',time:'1 小时前'}];
  modal(`<h2 style="font-size:17px;margin-bottom:12px">通知 <span class="chip p0" style="vertical-align:3px">3 条未读</span></h2>${list.map(n=>`<div class="ev-row"><span style="font-size:17px">${n.icon}</span><div style="flex:1"><b style="font-size:13px">${esc(n.text)}</b><div class="mt">${esc(n.time)}</div></div></div>`).join('')}<div style="text-align:right;margin-top:8px"><button class="btn sec sm" data-act="close">全部标为已读</button></div>`);
}
/* 留言抽屉 */
function drawerOpen(){$('#drawer-root').innerHTML=`<div class="mask" style="justify-content:flex-end;background:rgba(5,6,8,.45)" data-act="close-drawer"><div class="drawer" onclick="event.stopPropagation()">
 <div style="display:flex;align-items:center;gap:10px;padding:18px 20px;border-bottom:1px solid var(--line)"><b>站内留言</b><span class="grow" style="flex:1"></span><button class="btn ghost" data-act="close-drawer">✕</button></div>
 <div style="display:flex;flex:1;min-height:0">
  <div style="width:118px;flex:none;border-right:1px solid var(--line);padding:10px 8px;overflow-y:auto" id="conv-list"></div>
  <div style="flex:1;display:flex;flex-direction:column;min-width:0"><div id="conv-body" style="flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column"></div>
   <div style="display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)"><input id="msg-inp" placeholder="发消息…" style="flex:1" onkeydown="if(event.key==='Enter')sendMsg()"><button class="btn pri" onclick="sendMsg()">发送</button></div></div></div></div></div>`;
 renderDrawer();track('打开留言面板','');}
function renderDrawer(){
  const others=S.members.filter(m=>m.id!==S.me.id);
  $('#conv-list').innerHTML=others.map(m=>{const last=(S.messages.filter(x=>x.user_id===m.id).slice(-1)[0]);return `<div class="conv ${S.conv===m.id?'on':''}" onclick="S.conv=${m.id};renderDrawer()"><span style="position:relative;flex:none"><img class="avt sm" src="${AVA(m.id)}" onerror="this.style.visibility='hidden'">${m.online?'<i class="dot-online" style="border-color:var(--panel)"></i>':''}</span><div style="min-width:0"><b style="font-size:12px;display:block">${esc(m.name)}</b><span class="dim" style="font-size:10px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:66px">${esc(last?last.text:'开始对话')}</span></div></div>`}).join('');
  const list=S.messages.filter(x=>x.user_id===S.conv);
  $('#conv-body').innerHTML=(list.length?list.map(x=>`<div class="${x.from_me?'msg-me':'msg-them'}">${esc(x.text)}</div>`).join(''):`<p class="dim" style="font-size:12px;margin:auto;text-align:center">和 ${esc(user(S.conv).name)} 还没有留言<br>${S.metrics&&S.metrics.offline?'对方自动回复仅在联网模式生效':'对方会随机自动回复一条'}</p>`) + (list.length?'':'');
}
async function sendMsg(){
  const inp=$('#msg-inp'),txt=inp.value.trim();if(!txt)return;inp.value='';
  S.messages.push({id:Date.now(),user_id:S.conv,from_me:true,text:txt});renderDrawer();track('发送留言',user(S.conv).name);
  try{const rows=await api('/api/messages',{user_id:S.conv,text:txt});
    S.messages=S.messages.filter(x=>x.id!==Date.now());rows.forEach(r=>S.messages.push(r));}
  catch(e){setTimeout(()=>{S.messages.push({id:Date.now()+1,user_id:S.conv,from_me:false,text:'（离线演示）稍后同步给你'});renderDrawer();},900);}
  renderDrawer();
}
/* ================= 命令面板 ================= */
function palToggle(){S.palOpen=!S.palOpen;S.palQ='';S.palSel=0;renderPal();if(S.palOpen)$('#pal-inp').focus();}
function palHits(){
  const q=S.palQ.trim().toLowerCase();
  const cmds=[{g:'导航',t:'切换到 总览',run:()=>go('overview')},{g:'导航',t:'切换到 日历',run:()=>go('calendar')},{g:'导航',t:'切换到 成员',run:()=>go('member')},
   ...(isAdmin()?[{g:'操作',t:'＋ 新建项目',run:()=>newProjectModal()},{g:'操作',t:'＋ 新建日程',run:()=>newEventModal()}]:[]),
   {g:'操作',t:'打开留言面板',run:()=>drawerOpen()},{g:'操作',t:'重看新手指引',run:()=>tourStart()},{g:'操作',t:'退出登录',run:()=>doLogout()}];
  const tasks=S.tasks.concat(S.cards).filter(t=>!q||t.title.toLowerCase().includes(q)).slice(0,5).map(t=>({g:'任务',t:'▢ '+t.title+' · '+user(t.owner_id).name,run:()=>{go('task');setTimeout(()=>toast('已定位：'+t.title),300)}}));
  const pjs=S.projects.filter(p=>!q||p.name.toLowerCase().includes(q)).slice(0,4).map(p=>({g:'项目',t:'◈ '+p.name,run:()=>{S.detail=p;S.tab='tasks';go('project')}}));
  const mbs=S.members.filter(m=>m.id!==S.me.id&&(!q||m.name.includes(q)||m.account.includes(q))).slice(0,4).map(m=>({g:'成员',t:'☺ '+m.name+' · '+m.title,run:()=>{S.conv=m.id;go('member');drawerOpen()}}));
  return [...(q?[]:cmds.filter(c=>true).slice(0,0)),...tasks,...pjs,...mbs,...(!q?cmds:cmds.filter(c=>c.t.toLowerCase().includes(q)))];
}
function renderPal(){
  if(!S.palOpen){$('#pal-root').classList.add('hide');return;}
  const hits=S.palHits=palHits();
  $('#pal-root').classList.remove('hide');
  $('#pal-root').innerHTML=`<div class="pal"><input id="pal-inp" placeholder="搜索任务 / 项目 / 成员，或输入命令…" value="${esc(S.palQ)}" oninput="S.palQ=this.value;S.palSel=0;renderPal()" onkeydown="palKey(event)"><div style="max-height:320px;overflow-y:auto;padding-bottom:8px">${hits.map((h,i)=>`<div class="it ${i===S.palSel?'on':''}" onclick="palRun(${i})"><span class="dim" style="width:36px;font-size:10px">${h.g}</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis">${esc(h.t)}</span></div>`).join('')||'<p class="dim" style="padding:14px 16px;font-size:12.5px">没有匹配结果</p>'}</div></div>`;
}
function palKey(e){const n=S.palHits.length;if(e.key==='ArrowDown'){S.palSel=(S.palSel+1)%n;renderPal();$('#pal-inp').focus();}else if(e.key==='ArrowUp'){S.palSel=(S.palSel-1+n)%n;renderPal();$('#pal-inp').focus();}else if(e.key==='Enter'){palRun(S.palSel);}else if(e.key==='Escape')palToggle();}
function palRun(i){const h=S.palHits[i];if(!h)return;track('搜索',h.t);palToggle();h.run();}
/* ================= 新手指引 Tour ================= */
const TOUR=[
 {sel:'.side',t:'左侧导航栏',d:'七个入口：总览 / 项目 / 日历 / 任务 / 成员 / 设置（负责人还有 数据 与 管理后台）。「任务」上的橙点是逾期提醒。'},
 {sel:'.topbar .searchbox',t:'⌘K 命令面板',d:'按 Ctrl+K（Mac 为 ⌘K）随时唤起，搜任务、项目、成员，也能直达命令。'},
 {sel:'.tb-right',t:'快捷操作',d:'铃铛是通知，气泡是站内留言（会自动回复语料）；问号可随时重看本指引。'},
 {sel:'.view .card',t:'数据都来自服务端',d:'勾选任务、拖拽看板卡、新建日程都会写库并按角色记埋点——负责人在「管理后台」可看到全量热度排行。'},
 {sel:'.tb-right',t:'权限是分角色的',d:'用成员账号登录：任务只返回自己的、数据/管理后台入口隐藏、点管理操作会弹权限提示。试试退出换成 suwan 账号体验。'},
];
function tourStart(){S.tourStep=0;renderTour();}
function renderTour(){
  if(S.tourStep<0){$('#tour-root').innerHTML='';return;}
  const st=TOUR[S.tourStep];const el=document.querySelector(st.sel);
  const r=el?el.getBoundingClientRect():{top:120,left:120,width:200,height:80};
  const pad=8;
  $('#tour-root').innerHTML=`
   <div class="tour-mask" onclick="tourNext()"></div>
   <div class="tour-hl" style="top:${r.top-pad}px;left:${r.left-pad}px;width:${r.width+pad*2}px;height:${r.height+pad*2}px"></div>
   <div class="tour-card" style="top:${Math.min(r.bottom+16,innerHeight-190)}px;left:${Math.min(r.left,innerWidth-330)}px" onclick="event.stopPropagation()">
     <b style="font-size:14px">${st.t}</b><p class="mut" style="font-size:12.5px;margin:8px 0 12px">${st.d}</p>
     <div style="display:flex;align-items:center"><span class="dim num" style="font-size:11px">${S.tourStep+1} / ${TOUR.length}</span><span style="flex:1"></span>
     <button class="btn ghost sm" onclick="tourEnd()">跳过</button><button class="btn pri sm" onclick="tourNext()">${S.tourStep===TOUR.length-1?'完成 ✓':'下一步 →'}</button></div></div>`;
}
function tourNext(){S.tourStep++;if(S.tourStep>=TOUR.length){tourEnd(true);}else renderTour();}
function tourEnd(done){S.tourStep=-1;$('#tour-root').innerHTML='';if(done){track('完成指引','走完 '+TOUR.length+' 步');toast('🎉 指引完成，开始协作吧');}}

/* ================= 动作分发 ================= */
async function doLogout(){track('退出','');try{await api('/auth/logout',{});}catch(e){}location.reload();}
const ACT={
 'nav':el=>go(el.dataset.view),
 'pick-day':el=>{S.sideDay=+el.dataset.day;go(S.view);},
 'toggle':async el=>{
   const id=+el.dataset.id,t=[...S.tasks,...S.cards].find(x=>x.id===id);if(!t)return;
   const nd=!t.done;
   if(S.metrics&&S.metrics.offline){t.done=nd;t.overdue=nd?false:t.overdue;}
   else{try{const r=await api('/api/tasks/toggle',{id,done:nd});t.done=r.done;t.overdue=r.done?false:t.overdue;}catch(e){return toast(e.message,true);}}
   track(nd?'完成任务':'恢复任务',t.title);renderTopbar();go(S.view);
 },
 'new-project':()=>isAdmin()?newProjectModal():needAdmin(),
 'new-event':()=>isAdmin()?newEventModal():needAdmin(),
 'new-task':()=>newTaskModal(),
 'save-event':async()=>{
   if(!isAdmin())return needAdmin();
   const body={day:S.sideDay,time:$('#ev-time').value,title:$('#ev-title').value.trim(),meta:$('#ev-meta').value.trim(),color:$('#ev-color').value};
   if(!body.title)return toast('标题必填',true);
   try{const r=await api('/api/events',body);S.events.push(r);track('新建日程',body.title);closeModal();go(S.view);toast('日程已创建');}catch(e){toast(e.message,true);}
 },
 'del-event':async el=>{
   if(!isAdmin())return needAdmin();
   const id=+el.dataset.id;
   if(!(S.metrics&&S.metrics.offline)){
     try{const r=await fetch('/api/events/'+id,{method:'DELETE'});const j=await r.json();if(!j.ok)throw new Error(j.error);}
     catch(e){return toast(e.message,true);}
   }
   S.events=S.events.filter(x=>x.id!==id);track('删除日程','');go(S.view);toast('日程已删除');
 },
 'save-project':async()=>{
   if(!isAdmin())return needAdmin();
   const body={name:$('#pj-name').value.trim(),code:$('#pj-code').value.trim()||'PJ',deadline:$('#pj-ddl').value.trim(),total:+$('#pj-total').value||0,members:[]};
   if(!body.name)return toast('项目名称必填',true);
   try{const p=await api('/api/projects',body);S.projects.push(p);track('新建项目',body.name);closeModal();go('project');toast('项目已创建');}catch(e){toast(e.message,true);}
 },
 'save-task':async()=>{
   const body={title:$('#tk-title').value.trim(),prio:$('#tk-prio').value,due:$('#tk-due').value.trim()||'8月31日',dir:$('#tk-dir').value.trim()||'我的清单',tags:[]};
   if(!body.title)return toast('标题必填',true);
   try{const t=await api('/api/tasks',body);S.tasks.push(t);track('新建任务',body.title);closeModal();go(S.view);toast('任务已创建');}catch(e){if(S.metrics&&S.metrics.offline){S.tasks.push({id:Date.now(),...body,overdue:false,done:false,lane:null,tags:[],sub:'0/1',files:0,comments:0,highlight:false});closeModal();go(S.view);toast('（离线）已加入本地');}else toast(e.message,true);}
 },
 'open-project':el=>{S.detail=S.projects.find(p=>String(p.id)===el.dataset.id);S.tab='tasks';go('project');},
 'back-project':()=>{S.detail=null;go('project');},
 'ptab':el=>{S.tab=el.dataset.tab;go('project');},
 'open-doc':el=>renderDoc(S.docs[+el.dataset.i]||(S.metrics?.docs||[])[+el.dataset.i]),
 'file-preview':el=>renderFilePreview((S.metrics?.files||MOCK.metrics?.files||[])[+el.dataset.i]||{name:'文件',kind:'pdf',size:'-',date:'-',preview:'—'}),
 'close':closeModal,'close-mask':e=>{if(e.target.classList.contains('mask'))closeModal();},
 'close-drawer':()=>$('#drawer-root').innerHTML='',
 'msgs':()=>drawerOpen(),
 'notif':()=>notifModal(),
 'pal':()=>palToggle(),
 'tour':()=>tourStart(),
 'logout':doLogout,
 'invite':()=>toast('邀请链接已复制（演示）：把链接发给新同事，注册后即为成员角色'),
 'edit-profile':()=>toast('演示环境：请在「个人资料」卡片直接修改'),
 'save-profile':()=>toast('资料已保存（演示暂存）'),
 'ui-sw':el=>{const k=el.dataset.k;S.ui[k]=!S.ui[k];go('setting');},
 'refresh-admin':loadAdmin,
 'adm-tab':el=>{S.admTab=el.dataset.t;loadAdmin();},
 'adm-export':()=>{
   const rows=S.admRows||[];if(!rows.length)return toast('当前表无数据',true);
   const cols=Object.keys(rows[0]);
   const csv=[cols.join(','),...rows.map(r=>cols.map(c=>`"${String(r[c]??'').replace(/"/g,'""')}"`).join(','))].join('\n');
   const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download=(S.admTab||'wb_tasks')+'.csv';a.click();toast('CSV 已导出');
 },
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(el&&el.closest('#pal-root')?.length!==undefined&&el.closest('.pal'))return;
  if(el){const fn=ACT[el.dataset.act];if(fn){e.preventDefault();fn(el,e);return;}}
  if(e.target.id==='pal-root'){palToggle();}
  if(e.target.classList.contains('mask')&&e.target.dataset.act!=='close-drawer'){closeModal();}
});
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if($('#shell').classList.contains('hide'))return;palToggle();}
  if(e.key==='Escape'&&!e.repeat){if($('#drawer-root').innerHTML)$('#drawer-root').innerHTML='';else closeModal();}
});

/* ================= 看板拖拽 ================= */
let dragId=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest('.kcard');if(c){dragId=+c.dataset.card;c.classList.add('drag');}});
document.addEventListener('dragend',e=>{const c=e.target.closest('.kcard');c&&c.classList.remove('drag');document.querySelectorAll('.lane.over').forEach(l=>l.classList.remove('over'));});
document.addEventListener('dragover',e=>{const l=e.target.closest('.lane');if(l){e.preventDefault();document.querySelectorAll('.lane.over').forEach(x=>x!==l&&x.classList.remove('over'));l.classList.add('over');}});
document.addEventListener('drop',async e=>{
  const l=e.target.closest('.lane');if(!l||dragId==null)return;e.preventDefault();l.classList.remove('over');
  const lane=l.dataset.lane,card=S.cards.find(c=>c.id===dragId);dragId=null;
  if(!card||card.lane===lane)return;
  const old=card.lane;card.lane=lane;card.done=lane==='done';if(lane==='done')card.overdue=false;
  track('看板拖拽',card.title+'：'+old+'→'+lane);
  if(!(S.metrics&&S.metrics.offline)){try{await api('/api/tasks/move',{id:card.id,lane});}catch(err){card.lane=old;toast(err.message,true);}}
  go('project');
});

boot();
</script>
</body>
</html>
